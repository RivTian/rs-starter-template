{% raw -%}
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,     target: x86_64-unknown-linux-musl,  ext: "" }
          - { os: ubuntu-24.04-arm,  target: aarch64-unknown-linux-musl, ext: "" }
          - { os: macos-latest,      target: aarch64-apple-darwin,       ext: "" }
          - { os: windows-latest,    target: x86_64-pc-windows-msvc,     ext: ".exe" }
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked -p {% endraw %}{{project-name}}{% raw %} --target ${{ matrix.target }}
      - shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/{% endraw %}{{project-name}}{% raw %}${{ matrix.ext }}" "dist/{% endraw %}{{project-name}}{% raw %}-${{ matrix.target }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v7
        with:
          name: {% endraw %}{{project-name}}{% raw %}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
{%- endraw %}
