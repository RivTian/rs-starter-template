# rs-starter-template — https://github.com/RivTian/rs-starter-template
[template]
cargo_generate_version = ">=0.22.0"
ignore = ["hooks"]
# Files that contain their own `{{ }}` syntax and need no placeholders: copied verbatim.
exclude = ["cliff.toml", ".github/workflows/ci.yml", ".github/workflows/docker.yml"]

[placeholders]
project-description = { type = "string", prompt = "One-line description of the service", default = "A Rust service built from rs-starter-template" }
license = { type = "string", prompt = "License", choices = ["MIT", "Apache-2.0", "MIT OR Apache-2.0"], default = "MIT" }
include_docker = { type = "bool", prompt = "Include Dockerfile, docker-compose.yml and the docker workflow?", default = true }
repository = { type = "string", prompt = "Repository URL (leave empty to skip)", default = "", regex = "^(|https?://[^ ]+)$" }

[conditional.'include_docker == false']
ignore = ["Dockerfile", "docker-compose.yml", ".dockerignore", ".github/workflows/docker.yml"]

[hooks]
pre = ["hooks/pre.rhai"]
