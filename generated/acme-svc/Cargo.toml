[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo run` / `cargo build` without `-p` act on the binary crate.
default-members = ["crates/acme-svc"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
publish = false

# ── Dependencies ────────────────────────────────────────────────────────────
# Rule: every version lives here, once. Members write `foo = { workspace = true }` and may
# add features. Third-party crates default to `default-features = false`; opt in explicitly.
[workspace.dependencies]
# internal
acme-svc-api        = { path = "crates/acme-svc-api" }
acme-svc-config     = { path = "crates/acme-svc-config" }
acme-svc-core       = { path = "crates/acme-svc-core" }
acme-svc-domain     = { path = "crates/acme-svc-domain" }
acme-svc-infra      = { path = "crates/acme-svc-infra" }
acme-svc-test-utils = { path = "crates/acme-svc-test-utils" }
acme-svc-util       = { path = "crates/acme-svc-util" }

# async runtime
tokio      = { version = "1.53", default-features = false, features = ["rt-multi-thread", "macros", "signal", "net", "time", "sync"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
async-trait = "0.1"

# http
axum       = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tower      = { version = "0.5", default-features = false, features = ["util"] }
tower-http = { version = "0.7", default-features = false, features = ["trace", "timeout", "limit", "catch-panic"] }

# serialization & config
serde           = { version = "1", default-features = false, features = ["derive", "std"] }
serde_json      = { version = "1", default-features = false, features = ["std"] }
toml            = { version = "1", default-features = false, features = ["parse", "display", "serde"] }
config          = { version = "0.15", default-features = false, features = ["toml"] }
humantime-serde = "1"
bytesize        = { version = "2", features = ["serde"] }

# errors
thiserror = { version = "2", default-features = false }
anyhow    = { version = "1", default-features = false, features = ["std"] }

# observability
tracing            = { version = "0.1", default-features = false, features = ["std", "attributes"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["env-filter", "fmt", "json", "ansi", "std"] }
metrics            = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }

# cli
clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "env", "string"] }

# misc
uuid    = { version = "1", default-features = false, features = ["v7", "serde", "std"] }
time    = { version = "0.3", default-features = false, features = ["std", "serde", "formatting", "parsing"] }
dashmap = { version = "6", default-features = false }

# build / test only
vergen-gitcl = { version = "10", features = ["build", "rustc"] }
reqwest      = { version = "0.13", default-features = false, features = ["json"] }

# ── Lints ───────────────────────────────────────────────────────────────────
# This block is the coding standard. Members write `[lints] workspace = true`.
# Local escapes must use `#[expect(lint, reason = "...")]`, never bare `#[allow]`.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "allow"              # opt in per crate (acme-svc-config denies it)
unreachable_pub = "warn"

[workspace.lints.clippy]
# Groups
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

# Never panic in library code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Style we want
use_self = "deny"
if_then_some_else_none = "deny"
redundant_clone = "deny"
semicolon_outside_block = "deny"
undocumented_unsafe_blocks = "deny"

# Allowed with reasons
module_name_repetitions = "allow"        # `config::ConfigError` is clearer than `config::Error`
missing_errors_doc = "allow"             # error enums are self-documenting via `thiserror`
missing_panics_doc = "allow"             # panics are forbidden anyway
cargo_common_metadata = "allow"          # `repository`/`keywords` are optional for an application
multiple_crate_versions = "allow"        # transitive duplicates are not actionable here
future_not_send = "allow"                # axum/tower futures decide this, not us
significant_drop_tightening = "allow"    # too many false positives on short guards
option_if_let_else = "allow"             # often less readable than `match`
redundant_pub_crate = "allow"            # conflicts with `unreachable_pub`
cast_precision_loss = "allow"            # metrics gauges are f64; usize→f64 loss is irrelevant

# ── Profiles ────────────────────────────────────────────────────────────────
[profile.dev]
debug = false                            # faster incremental builds; flip on when you need a debugger

[profile.release]
lto = true
codegen-units = 1
strip = "debuginfo"

[profile.profiling]
inherits = "release"
debug = true
strip = false

[profile.bench]
debug = true
