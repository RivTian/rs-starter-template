[package]
name = "acme-svc"
description = "A Rust service built from rs-starter-template"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "acme-svc"
path = "src/main.rs"

[lib]
name = "acme_svc"
