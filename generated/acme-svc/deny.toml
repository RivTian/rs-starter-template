# cargo-deny: advisories, licenses, duplicate versions and sources.
# https://embarkstudios.github.io/cargo-deny/checks/index.html

[graph]
all-features = true

[advisories]
ignore = []

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[licenses.private]
# Workspace crates are `publish = false`; they need no license field to pass this check.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true   # internal `path = ...` deps carry no version (publish = false)
highlight = "all"
deny = [
  # keep the async ecosystem on one runtime
  { crate = "async-std", reason = "we use tokio" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
