name: 功能 / 改进
description: 想给模板、快照或生成项目增加或修改的能力。
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        架构层面的决定已在 `docs/design/00–08` 里定下；与之冲突的提议请先说明为什么要改。
  - type: dropdown
    id: scope
    attributes:
      label: 影响范围
      multiple: true
      options:
        - template/（模板源）
        - generated/acme-svc（快照）
        - 用模板生成出来的项目
        - template-ci / justfile / scripts
        - docs/
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: 动机
      description: 要解决什么问题，现在为什么做不到或做得不好
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 方案
      description: 做法、涉及模块、依赖变化、对生成项目的影响
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案与不选它们的理由
  - type: textarea
    id: upstream
    attributes:
      label: 上游依据
      description: Pumpkin / Pingora / 其它仓库的做法，带链接或 `file:line`
  - type: textarea
    id: verify
    attributes:
      label: 验证方法
